name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt

      - name: Run Ruff on application code
        run: ruff check src streamlit_app --output-format=concise

      - name: Capture Ruff test diagnostics
        run: |
          set +e
          ruff check tests --output-format=concise > ruff-tests.txt 2>&1
          status=$?
          cat ruff-tests.txt
          echo "$status" > ruff-tests-status.txt
          exit 0

      - name: Upload Ruff test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ruff-test-diagnostics
          path: |
            ruff-tests.txt
            ruff-tests-status.txt
          retention-days: 3

      - name: Enforce Ruff test result
        run: test "$(cat ruff-tests-status.txt)" -eq 0

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
