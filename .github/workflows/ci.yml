name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest tests/ -q

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Record verification dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version

          for package in ("pandas", "streamlit", "pytest", "ruff", "pip-audit"):
              print(f"{package}=={version(package)}")
          PY

      - name: Run Ruff on application code
        run: ruff check src streamlit_app --output-format=concise

      - name: Run Ruff on tests
        run: ruff check tests --output-format=concise

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t llm-business-insight-assistant .

      - name: Verify non-root image configuration
        run: test "$(docker inspect --format '{{.Config.User}}' llm-business-insight-assistant)" = "app"

      - name: Smoke-test Streamlit health endpoint
        run: |
          container_id=$(docker run -d -p 8501:8501 llm-business-insight-assistant)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1
