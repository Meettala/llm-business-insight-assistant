    <text x="130" y="245" fill="#f8fafc" font-size="58" font-weight="700">LLM Business Insight</text>
    <text x="130" y="310" fill="#f8fafc" font-size="58" font-weight="700">Assistant</text>
    <text x="130" y="365" fill="#cbd5e1" font-size="26">Safety-first CSV analytics with constrained parsing</text>
    <text x="130" y="403" fill="#cbd5e1" font-size="26">and deterministic pandas execution.</text>

    <rect x="130" y="455" width="210" height="50" rx="25" fill="#0c4a6e"/>
    <text x="235" y="488" text-anchor="middle" fill="#e0f2fe" font-size="19" font-weight="700">Validated QuerySpec</text>

    <rect x="360" y="455" width="178" height="50" rx="25" fill="#14532d"/>
    <text x="449" y="488" text-anchor="middle" fill="#dcfce7" font-size="19" font-weight="700">No eval / exec</text>

    <rect x="558" y="455" width="160" height="50" rx="25" fill="#4c1d95"/>
    <text x="638" y="488" text-anchor="middle" fill="#ede9fe" font-size="19" font-weight="700">Python CI</text>

    <g transform="translate(810 170)">
      <rect x="0" y="0" width="300" height="265" rx="26" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="150" y="52" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Safe execution flow</text>
      <rect x="45" y="82" width="210" height="44" rx="12" fill="#0c4a6e"/>
