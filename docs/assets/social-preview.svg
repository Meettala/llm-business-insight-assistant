<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LLM Business Insight Assistant</title>
  <desc id="desc">Portfolio social preview for a safety-first CSV analytics assistant with constrained LLM parsing and deterministic execution.</desc>
  <rect width="1280" height="640" fill="#0f172a"/>
  <circle cx="1110" cy="100" r="220" fill="#172554"/>
  <circle cx="120" cy="600" r="260" fill="#052e16"/>
  <rect x="80" y="78" width="1120" height="484" rx="34" fill="#111827" stroke="#334155" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
