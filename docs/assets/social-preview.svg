      <path d="M150 194 V218" stroke="#64748b" stroke-width="4"/>
      <rect x="45" y="218" width="210" height="44" rx="12" fill="#14532d"/>
      <text x="150" y="247" text-anchor="middle" fill="#dcfce7" font-size="17">Deterministic result</text>
